name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'infra/cloud-run/api-service.yaml'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.GAR_REPO_LOCATION }}-docker.pkg.dev
  IMAGE_TAG: ${{ vars.GAR_REPO_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPO_NAME }}/api:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Docker auth
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Render service definition
        run: |
          envsubst < infra/cloud-run/api-service.yaml > /tmp/service.yaml
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          BQ_DATASET_NAME: ${{ vars.BQ_DATASET_NAME }}
          GAR_REPO_LOCATION: ${{ vars.GAR_REPO_LOCATION }}
          SENTIMENT_MODEL_ID: ${{ vars.SENTIMENT_MODEL_ID }}
          INFERENCE_BACKEND: ${{ vars.INFERENCE_BACKEND }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          metadata: /tmp/service.yaml
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GAR_REPO_LOCATION }}

      - name: Show service URL
        run: |
          echo "### Deployed to [${{ steps.deploy.outputs.url }}](${{ steps.deploy.outputs.url }})" >> "$GITHUB_STEP_SUMMARY"
